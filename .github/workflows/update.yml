name: Update data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the busy :00 mark (GitHub may still run late)
  workflow_dispatch: {}
  push:
    branches: [main]               # redeploy when you edit config.json / the page

permissions:
  contents: write    # commit docs/data.json + data/state.json
  pages: write       # deploy GitHub Pages
  id-token: write    # required by actions/deploy-pages

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch Blizzard data
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/fetch.mjs

      # Pushes made with GITHUB_TOKEN never start new workflow runs, so there is no loop.
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/state.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
